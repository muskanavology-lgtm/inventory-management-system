name: Daily Auto Commit at 5:00 PM IST
on:
  schedule:
   - cron: '0 17 * * *'
  workflow_dispatch:
jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Update Daily Log File
        run: |
          echo "Automated Daily Activity Log - $(date)" >> daily-activity.log
      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add daily-activity.log
          git commit -m "chore(auto): daily scheduled update at 5:00 PM IST [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
