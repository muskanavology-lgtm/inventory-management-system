name: Daily Auto Commit at 5:55 PM IST

on:
  schedule:
    # 5:55 PM IST converts to 12:25 PM UTC
    - cron: '25 12 * * *'
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Daily Log File
        run: |
          echo "Automated Daily Commit - $(date)" >> daily-activity.log
          echo "Time: $(date +'%Y-%m-%d %H:%M:%S')" >> daily-activity.log
          echo "---" >> daily-activity.log

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add daily-activity.log
          git commit -m "chore(auto): daily scheduled update at 5:55 PM IST [$(date +'%Y-%m-%d %H:%M:%S')]" || echo "No changes to commit"
          git push
