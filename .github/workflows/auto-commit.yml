name: Daily Auto Commit Pipeline

on:
  schedule:
    # Har din Indian Time (IST) ke hisab se din ke 12:00 PM par chalega (6:30 AM UTC)
    - cron: '30 6 * * *'
  workflow_dispatch: # Manual test ke liye button

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Update Daily Log File
        run: |
          echo "CI/CD Auto-Commit Log: $(date)" >> cI_cd_activity.log

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cI_cd_activity.log
          git commit -m "chore(ci/cd): daily automated progress update [skip ci]" || echo "No changes to commit"
          git push